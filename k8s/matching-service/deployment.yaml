apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: matching-service }
  template:
    metadata:
      labels: { app: matching-service }
    spec:
      containers:
        - name: matching-service
          image: ghcr.io/OWNER/labourse-microservices/matching-service:latest
          ports: [{ containerPort: 8082 }]
          envFrom:
            - secretRef: { name: labourse-app-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: matching-service
spec:
  selector: { app: matching-service }
  ports: [{ port: 8082, targetPort: 8082 }]
