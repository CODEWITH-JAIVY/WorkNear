apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: admin-service }
  template:
    metadata:
      labels: { app: admin-service }
    spec:
      containers:
        - name: admin-service
          image: ghcr.io/OWNER/labourse-microservices/admin-service:latest
          ports: [{ containerPort: 8090 }]
          envFrom:
            - secretRef: { name: labourse-app-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8090 }
            initialDelaySeconds: 25
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8090 }
            initialDelaySeconds: 40
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
spec:
  selector: { app: admin-service }
  ports: [{ port: 8090, targetPort: 8090 }]
