apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: labourse-app-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: labourse-app-secrets   # matches every deployment.yaml's secretRef
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: labourse/production/app-secrets   # matches terraform's aws_secretsmanager_secret name
