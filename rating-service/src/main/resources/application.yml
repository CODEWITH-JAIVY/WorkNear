server:
  port: 8090

spring:
  application:
    name: rating-service
  cloud:
    config:
      enabled: false          # local testing: Config Server band
  datasource:
    url: jdbc:mysql://localhost:3306/rating_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET:local-dev-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info