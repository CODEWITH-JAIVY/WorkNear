x-eureka: &eureka
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
  SPRING_CLOUD_CONFIG_ENABLED: "false"

x-db: &db
  SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  DB_HOST: mysql
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}

services:
  # ---------- Infra ----------
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: labourse_auth
    ports: ["3306:3306"]
    volumes:
      - "mysql_data:/var/lib/mysql"
      - "./mysql-init:/docker-entrypoint-initdb.d"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    restart: always
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ---------- Platform ----------
  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: discovery-server }
    restart: on-failure
    ports: ["8761:8761"]
    environment:
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  config-server:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: config-server }
    restart: on-failure
    ports: ["8888:8888"]
    depends_on: [discovery-server]
    environment:
      <<: *eureka

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: api-gateway }
    restart: on-failure
    ports: ["8080:8080"]
    depends_on: [discovery-server]
    environment:
      <<: *eureka
      JWT_SECRET: ${JWT_SECRET}

  # ---------- Business services ----------
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: auth-service }
    restart: on-failure
    depends_on:
      mysql: { condition: service_healthy }
      discovery-server: { condition: service_started }
      kafka: { condition: service_started }
    environment:
      <<: [*eureka, *db]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/labourseAuthService?createDatabaseIfNotExist=true
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKER: kafka:9092
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}

  matching-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: matching-service }
    restart: on-failure
    depends_on:
      redis: { condition: service_healthy }
      discovery-server: { condition: service_started }
    environment:
      <<: *eureka
      REDIS_HOST: redis

  customer-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: customer-service }
    restart: on-failure
    depends_on:
      mysql: { condition: service_healthy }
      discovery-server: { condition: service_started }
      kafka: { condition: service_started }
    environment:
      <<: [*eureka, *db]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/labourCustomer?createDatabaseIfNotExist=true
      KAFKA_BROKER: kafka:9092

  labour-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: labour-service }
    restart: on-failure
    depends_on:
      mysql: { condition: service_healthy }
      discovery-server: { condition: service_started }
      kafka: { condition: service_started }
    environment:
      <<: [*eureka, *db]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/labourLabour?createDatabaseIfNotExist=true
      KAFKA_BROKER: kafka:9092
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}

  job-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: job-service }
    restart: on-failure
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      discovery-server: { condition: service_started }
      kafka: { condition: service_started }
    environment:
      <<: [*eureka, *db]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/labourJob?createDatabaseIfNotExist=true
      REDIS_HOST: redis
      KAFKA_BROKER: kafka:9092

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: notification-service }
    restart: on-failure
    depends_on:
      discovery-server: { condition: service_started }
      kafka: { condition: service_started }
    environment:
      <<: *eureka
      KAFKA_BROKER: kafka:9092

  media-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: media-service }
    restart: on-failure
    depends_on:
      discovery-server: { condition: service_started }
    environment:
      <<: *eureka
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: payment-service }
    restart: on-failure
    depends_on:
      mysql: { condition: service_healthy }
      discovery-server: { condition: service_started }
    environment:
      <<: [*eureka, *db]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/labourPayment?createDatabaseIfNotExist=true
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}

  rating-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: rating-service }
    restart: on-failure
    depends_on:
      mysql: { condition: service_healthy }
      discovery-server: { condition: service_started }
    environment:
      <<: [*eureka, *db]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/labourRating?createDatabaseIfNotExist=true
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}

  admin-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: admin-service }
    restart: on-failure
    depends_on:
      mysql: { condition: service_healthy }
      discovery-server: { condition: service_started }
    environment:
      <<: [*eureka, *db]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/labourAdmin?createDatabaseIfNotExist=true
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}

  kyc-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: kyc-service }
    restart: on-failure
    depends_on:
      mysql: { condition: service_healthy }
      discovery-server: { condition: service_started }
      kafka: { condition: service_started }
    environment:
      <<: [*eureka, *db]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/labourKyc?createDatabaseIfNotExist=true
      KAFKA_BROKER: kafka:9092
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: chat-service }
    restart: on-failure
    depends_on:
      mysql: { condition: service_healthy }
      discovery-server: { condition: service_started }
    environment:
      <<: [*eureka, *db]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/labourChat?createDatabaseIfNotExist=true
      KAFKA_BROKER: kafka:9092

  # ---------- Observability ----------
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    depends_on: [prometheus]

volumes:
  mysql_data: