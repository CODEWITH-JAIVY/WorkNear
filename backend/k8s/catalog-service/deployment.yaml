apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: catalog-service }
  template:
    metadata:
      labels: { app: catalog-service }
    spec:
      containers:
        - name: catalog-service
          image: ghcr.io/OWNER/labourse-microservices/catalog-service:latest
          ports: [{ containerPort: 8093 }]
          envFrom:
            - secretRef: { name: labourse-app-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8093 }
            initialDelaySeconds: 25
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  selector: { app: catalog-service }
  ports: [{ port: 8093, targetPort: 8093 }]
