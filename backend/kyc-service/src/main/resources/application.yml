server:
  port: 8091

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

spring:
  application:
    name: kyc-service
  cloud:
    config:
      enabled: false          # local testing: Config Server band
  datasource:
    url: jdbc:mysql://localhost:3306/labourKyc?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 3000
        spring.json.add.type.headers: false

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET:dev-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info