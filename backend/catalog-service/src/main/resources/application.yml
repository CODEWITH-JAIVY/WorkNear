server:
  port: 8093

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

spring:
  application:
    name: catalog-service
  cloud:
    config:
      enabled: false          # Config Server is not used; each service reads its own application.yml + env vars
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/labourCatalog?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info
