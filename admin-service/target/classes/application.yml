server:
  port: 8082

spring:
  application:
    name: admin-service

  cloud:
    config:
      enabled: false        # local testing: Config Server band

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/labourAdmin?createDatabaseIfNotExist=true}
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET:dev-secret}   # AuthServiceClient ko ye chahiye

admin:
  jwt:
    secret: ${ADMIN_JWT_SECRET}          # REQUIRED, minimum 32 characters (staff tokens ye sign hote hain)
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  security:
    max-failed-attempts: 5
    lock-minutes: 15
  bootstrap:                             # sirf tab use hota hai jab staff table bilkul khali ho
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
