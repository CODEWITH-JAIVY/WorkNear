server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

spring:
  application:
    name: labour-service
  cloud:
    config:
      enabled: false          # local testing: Config Server band
  datasource:
    url: jdbc:mysql://localhost:3306/labourLabour?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    consumer:
      group-id: labour-service
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET:dev-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info