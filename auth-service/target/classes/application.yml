server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/labourseAuthService
    username: root
    password: Codewithjaivy@123580
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 3000
        spring.json.add.type.headers: false



  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET:local-internal-secret}

jwt:
  secret: ${JWT_SECRET:your-local-jwt-secret-change-this-to-a-long-random-secret}
  access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
  refresh-token-expiry-ms: ${JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info