server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [email, profile]

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET}

# NOTE: DB creds, JWT secret pulled from config-server (configs/auth-service.yml)
# which reads them from env vars — nothing sensitive lives in this repo.
management:
  endpoints:
    web:
      exposure:
        include: health,info
